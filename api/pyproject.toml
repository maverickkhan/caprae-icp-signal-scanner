[project]
name = "icp-scanner-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.1",
    "langchain-google-genai>=4.4.0",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "protego>=0.6.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.0.54",
    "tenacity>=9.1.4",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.53.0",
]
mcp = [
    "mcp>=2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
